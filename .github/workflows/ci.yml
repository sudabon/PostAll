name: ci

on:
  pull_request:
    branches: [main, slack-style-memo-app]

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - name: Check gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Check sqlc generated files
        run: |
          go tool sqlc generate
          git diff --exit-code -- .
      - run: go vet ./...
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  electron:
    runs-on: ubuntu-latest
    # Electron が起動できないと E2E が待ち続けることがあったので、上限を設ける。
    timeout-minutes: 20
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            electron/package-lock.json
            frontend/package-lock.json
      # csp.e2e.mjs（electron:built-dist）は本番ビルドの frontend/dist を読み込む。
      - name: Build frontend for Electron E2E
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - run: npm ci
      # ubuntu-latest（24.04）は AppArmor で非特権の user namespace を制限しているので、
      # Chromium は setuid の chrome-sandbox を使う。npm が展開したままでは root 所有でなく、
      # Electron が起動直後に FATAL で abort する。sandbox を外さずに、所有者と権限を整える。
      - name: Configure Chromium setuid sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      # E2E は実際に BrowserWindow を開くので仮想ディスプレイが要る。
      - run: xvfb-run -a npm test

  backup-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ubuntu-latest には shellcheck と gpg が入っている。
      - run: shellcheck ops/backup/*.sh
      - run: bash ops/backup/verify-dump-recipients.test.sh

  openapi-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: Generate from OpenAPI and fail on drift
        run: |
          make generate
          # git diff だけでは新規生成された未追跡ファイルを見逃すのでインデックスに載せて比較する。
          git add -A
          git diff --cached --exit-code
