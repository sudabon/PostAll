name: ci

on:
  push:
    branches: [main, slack-style-memo-app]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - name: Check gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Check sqlc generated files
        run: |
          go tool sqlc generate
          git diff --exit-code -- .
      - run: go vet ./...
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  flutter:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # pubspec.lock を解決したローカル環境と揃える。stable 任せだと
          # SDK が上がった際に lock が再解決され、analyzer と source_gen が非互換になる。
          flutter-version: "3.32.8"
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  openapi-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - uses: subosito/flutter-action@v2
        with:
          # pubspec.lock を解決したローカル環境と揃える。stable 任せだと
          # SDK が上がった際に lock が再解決され、analyzer と source_gen が非互換になる。
          flutter-version: "3.32.8"
          channel: stable
      - name: Install mobile dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Generate from OpenAPI and fail on drift
        run: |
          make generate
          # git diff だけでは新規生成された未追跡ファイルを見逃すのでインデックスに載せて比較する。
          git add -A
          git diff --cached --exit-code
