name: ops

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
    - cron: "15 3 * * *"

jobs:
  migrate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: Apply database migrations (session pooler, IPv4)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: go run ./cmd/postall-server migrate

  emoji-sync:
    if: github.event_name != 'schedule'
    needs: migrate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: Sync emoji catalog to Storage and DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMOJI_DIR: ${{ github.workspace }}/emoji
          EMOJI_S3_BUCKET: ${{ secrets.EMOJI_S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: go run ./cmd/postall-server emoji-sync

  reap:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reap pending attachments (keep-alive)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/internal/attachments/reap"

  db-dump:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '15 3 * * *') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: supabase db dump --db-url "$DATABASE_URL" -f postall.dump.sql
      - uses: actions/upload-artifact@v4
        with:
          name: postall-db-dump
          path: postall.dump.sql
          retention-days: 30
