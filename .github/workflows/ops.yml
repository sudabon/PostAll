name: ops

concurrency:
  group: ops-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
    - cron: "15 3 * * *"

jobs:
  reap:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Reap pending attachments (keep-alive)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          : "${APP_URL:?APP_URL secret is required}"
          : "${CRON_SECRET:?CRON_SECRET secret is required}"
          curl --fail-with-body -sS --max-time 120 --retry 2 --retry-connrefused -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/internal/attachments/reap"

  prune-events:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prune expired change events
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          : "${APP_URL:?APP_URL secret is required}"
          : "${CRON_SECRET:?CRON_SECRET secret is required}"
          curl --fail-with-body -sS --max-time 120 --retry 2 --retry-connrefused -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/internal/events/prune"

  db-dump:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '15 3 * * *') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: "2.116.0"
      - name: Dump and encrypt database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          public_key="$GITHUB_WORKSPACE/ops/backup/postall-backup.pub.asc"
          plain="$RUNNER_TEMP/postall.dump.sql"
          compressed="$RUNNER_TEMP/postall.dump.sql.gz"
          encrypted="$GITHUB_WORKSPACE/postall.dump.sql.gz.gpg"
          # CI は復号できる鍵を持たない。公開鍵だけを空の一時キーリングで使う。
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$plain" "$compressed" "$GNUPGHOME"' EXIT
          if [ ! -s "$public_key" ]; then
            echo "Backup public key is missing: $public_key" >&2
            exit 1
          fi
          supabase db dump \
            --db-url "$DATABASE_URL" \
            --data-only \
            --schema public \
            --use-copy \
            --exclude public.goose_db_version \
            -f "$plain"
          min_bytes=1024
          plain_bytes=$(stat -c '%s' "$plain")
          if (( plain_bytes < min_bytes )); then
            echo "Plain dump is ${plain_bytes} bytes; minimum is ${min_bytes}." >&2
            exit 1
          fi
          copy_count=$(grep -c '^COPY ' "$plain" || true)
          if (( copy_count == 0 )); then
            echo "Plain dump has no COPY statements." >&2
            exit 1
          fi
          gzip -9 -c "$plain" > "$compressed"
          # 鍵の正しさはキーリングの信頼モデルではなく、リポジトリへのコミット（レビュー）で担保する。
          gpg \
            --batch \
            --yes \
            --trust-model always \
            --recipient-file "$public_key" \
            --output "$encrypted" \
            --encrypt \
            "$compressed"
          # 公開鍵だけが宛先で、共通鍵の復号経路が無いことを確かめてからアップロードする。
          if ! bash "$GITHUB_WORKSPACE/ops/backup/verify-dump-recipients.sh" "$encrypted" "$public_key"; then
            rm -f "$encrypted"
            exit 1
          fi
          max_bytes=$((10 * 1024 * 1024))
          actual_bytes=$(stat -c '%s' "$encrypted")
          if (( actual_bytes > max_bytes )); then
            echo "Encrypted dump is ${actual_bytes} bytes; maximum is ${max_bytes}." >&2
            rm -f "$encrypted"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: postall-db-dump-${{ github.run_id }}
          path: postall.dump.sql.gz.gpg
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
