openapi: 3.0.3
info:
  title: PostAll API
  version: 0.1.0
  description: 3 クライアント共通の PostAll HTTP API。
servers:
  - url: /
paths:
  /health:
    get:
      operationId: getHealth
      tags: [ops]
      security: []
      responses:
        "200":
          description: 稼働中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: 依存先が落ちている
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/channels:
    get:
      operationId: listChannels
      tags: [channels]
      summary: チャネル階層を一覧する
      responses:
        "200":
          description: 階層関係と並び順を復元できるチャネル一覧
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelList"
        "403":
          $ref: "#/components/responses/AccountNotAllowed"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createChannel
      tags: [channels]
      summary: チャネルを作成する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
      responses:
        "201":
          description: 作成されたチャネル
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "403":
          $ref: "#/components/responses/AccountNotAllowed"
        "409":
          description: |
            次のいずれか。`code` で区別する。
            - `name_conflict`: 同じ階層に同名のチャネルがある
            - `encryption_not_configured`: 鍵束が未設定の状態で暗号化チャネルを作ろうとした
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/channels/{channelId}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    patch:
      operationId: renameChannel
      tags: [channels]
      summary: チャネルをリネームする
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameChannelRequest"
      responses:
        "200":
          description: 更新後のチャネル
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "403":
          $ref: "#/components/responses/AccountNotAllowed"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteChannel
      tags: [channels]
      summary: ポストを持たないチャネルを削除する
      responses:
        "204":
          description: 削除成功
        "403":
          $ref: "#/components/responses/AccountNotAllowed"
        default:
          $ref: "#/components/responses/Error"
  /v1/channels/{channelId}/move:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: moveChannel
      tags: [channels]
      summary: 親の付け替えと並び替え
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveChannelRequest"
      responses:
        "200":
          description: 適用後の親と sort_key を含むチャネル
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "403":
          $ref: "#/components/responses/AccountNotAllowed"
        default:
          $ref: "#/components/responses/Error"
  /v1/channels/{channelId}/posts:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    get:
      operationId: listChannelPosts
      tags: [posts]
      summary: チャネル直下のポストを keyset で取得する
      description: |
        thread_root_id が null の行のみを返す。
        カーソル無しなら最新 limit 件（既定 10）を昇順で返す。
        before を付けると、そのカーソルより古いポストを昇順で返す。
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: before
          in: query
          schema:
            type: string
          description: より古いポストを取るカーソル（nextBefore の値）
        - name: around
          in: query
          schema:
            type: string
            format: uuid
          description: 検索結果から移動するとき、このルートポストを含む履歴を返す。
      responses:
        "200":
          description: 昇順のポスト一覧と、さらに過去がある場合のカーソル
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostList"
        "403":
          $ref: "#/components/responses/AccountNotAllowed"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createChannelPost
      tags: [posts]
      summary: チャネル直下にポストを作成する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: 作成されたポスト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/PostContentRejected"
        "403":
          $ref: "#/components/responses/AccountNotAllowed"
        "409":
          $ref: "#/components/responses/EncryptionNotConfigured"
        default:
          $ref: "#/components/responses/Error"
  /v1/posts/{postId}:
    parameters:
      - $ref: "#/components/parameters/PostId"
    patch:
      operationId: editPost
      tags: [posts]
      summary: ポスト本文を上書きする
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditPostRequest"
      responses:
        "200":
          description: 更新後のポスト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/PostContentRejected"
        "403":
          $ref: "#/components/responses/AccountNotAllowed"
        "409":
          description: |
            次のいずれか。`code` で区別する。
            - `post_deleted`: 削除済みのポストを編集しようとした
            - `encryption_not_configured`: 鍵束が未設定の状態で暗号化チャネルのポストを編集しようとした
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePost
      tags: [posts]
      summary: ポストを論理削除する
      responses:
        "204":
          description: 削除成功
        "403":
          $ref: "#/components/responses/AccountNotAllowed"
        default:
          $ref: "#/components/responses/Error"
  /v1/posts/{postId}/thread:
    parameters:
      - $ref: "#/components/parameters/PostId"
    get:
      operationId: getThread
      tags: [posts]
      summary: 親ポストと返信を古い順で取得する
      description: |
        親が論理削除済みならプレースホルダとして deleted=true で返す。
        削除済みの返信は含めない。
      responses:
        "200":
          description: スレッド
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Thread"
        "403":
          $ref: "#/components/responses/AccountNotAllowed"
        default:
          $ref: "#/components/responses/Error"
  /v1/posts/{postId}/replies:
    parameters:
      - $ref: "#/components/parameters/PostId"
    post:
      operationId: createReply
      tags: [posts]
      summary: スレッドへ返信する
      description: 親が返信でも thread_root_id を継承し、多段スレッドは作らない。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: 作成された返信
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/PostContentRejected"
        "403":
          $ref: "#/components/responses/AccountNotAllowed"
        "409":
          $ref: "#/components/responses/EncryptionNotConfigured"
        default:
          $ref: "#/components/responses/Error"
  /v1/attachments/uploads:
    post:
      operationId: startAttachmentUpload
      tags: [attachments]
      summary: 添付のアップロード用署名付き URL を発行する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartUploadRequest"
      responses:
        "201":
          description: アップロード開始
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartUploadResponse"
        "403":
          $ref: "#/components/responses/AccountNotAllowed"
        default:
          $ref: "#/components/responses/Error"
  /v1/attachments/{attachmentId}/complete:
    parameters:
      - $ref: "#/components/parameters/AttachmentId"
    post:
      operationId: completeAttachment
      tags: [attachments]
      summary: アップロード完了を通知しメタデータを確定する
      responses:
        "200":
          description: 確定した添付
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "403":
          description: |
            次のいずれか。`code` で区別する。
            - `account_not_allowed`: このアカウントでは利用が許可されていない（許可リストに含まれない）
            - `forbidden`: 他人がアップロードした添付を確定しようとした
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/attachments/{attachmentId}/download:
    parameters:
      - $ref: "#/components/parameters/AttachmentId"
    get:
      operationId: getAttachmentDownload
      tags: [attachments]
      summary: ダウンロード用の短期署名付き URL を発行する
      responses:
        "200":
          description: 署名付き URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadUrlResponse"
        "403":
          description: |
            次のいずれか。`code` で区別する。
            - `account_not_allowed`: このアカウントでは利用が許可されていない（許可リストに含まれない）
            - `forbidden`: 他人がアップロードした添付を取得しようとした
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/emojis:
    get:
      operationId: listEmojis
      tags: [emojis]
      summary: 登録済みのカスタム絵文字を一覧する
      responses:
        "200":
          description: ショートコード順の絵文字カタログ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmojiList"
        "403":
          $ref: "#/components/responses/AccountNotAllowed"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createEmoji
      tags: [emojis]
      summary: カスタム絵文字を 1 件登録する
      description: |
        画像の実体を受け取り、形式・サイズ・ショートコードを検証してカタログへ登録する。
        受け付ける形式は PNG と GIF、上限サイズは 512 KiB。形式は申告値ではなく実体の内容で判定する。
        既に存在するショートコードでの登録は 409 で拒否し、既存の登録は変更しない。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateEmojiRequest"
      responses:
        "201":
          description: 登録された絵文字
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Emoji"
        "403":
          $ref: "#/components/responses/AccountNotAllowed"
        default:
          $ref: "#/components/responses/Error"
  /v1/emojis/{shortcode}/image:
    parameters:
      - $ref: "#/components/parameters/EmojiShortcode"
    get:
      operationId: getEmojiImage
      tags: [emojis]
      summary: カスタム絵文字の画像を取得する
      responses:
        "200":
          description: 絵文字画像。形式は Content-Type で示す
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/AccountNotAllowed"
        default:
          $ref: "#/components/responses/Error"
  /v1/posts/{postId}/reactions/{emojiId}:
    parameters:
      - $ref: "#/components/parameters/PostId"
      - $ref: "#/components/parameters/EmojiId"
    put:
      operationId: addReaction
      tags: [reactions]
      summary: ポストへリアクションを付与する
      description: 同じ付与要求が重複しても既存状態を維持して成功する。
      responses:
        "200":
          description: 付与後のリアクション集計
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reaction"
        "403":
          $ref: "#/components/responses/AccountNotAllowed"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeReaction
      tags: [reactions]
      summary: 自身のリアクションを解除する
      responses:
        "204":
          description: 解除成功。既に解除済みの場合も成功する。
        "403":
          $ref: "#/components/responses/AccountNotAllowed"
        default:
          $ref: "#/components/responses/Error"
  /v1/search:
    get:
      operationId: searchPosts
      tags: [search]
      summary: ポスト本文を全文検索する
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: channelId
          in: query
          schema:
            type: string
            format: uuid
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 新しい順の検索結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultPage"
        "403":
          $ref: "#/components/responses/AccountNotAllowed"
        default:
          $ref: "#/components/responses/Error"
  /v1/events:
    get:
      operationId: listChangeEvents
      tags: [events]
      summary: 指定したイベント ID より後の変更を取得する
      parameters:
        - name: after
          in: query
          description: 数値 ID、または履歴を再生せず現在位置から開始する `latest`
          schema:
            type: string
            pattern: '^([0-9]+|latest)$'
            default: "0"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: ID の昇順に並んだ変更イベント
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeEventPage"
        "403":
          $ref: "#/components/responses/AccountNotAllowed"
        default:
          $ref: "#/components/responses/Error"
  /v1/encryption/keyring:
    get:
      operationId: getEncryptionKeyring
      tags: [encryption]
      summary: 包んだマスター鍵（鍵束）を取得する
      description: |
        ワークスペースに 1 つの鍵束を返す。サーバーはパスフレーズ・復旧キー・マスター鍵の平文を持たない。
      responses:
        "200":
          description: 鍵束
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncryptionKeyring"
        "403":
          $ref: "#/components/responses/AccountNotAllowed"
        "404":
          description: 鍵束が未設定（`encryption_not_configured`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createEncryptionKeyring
      tags: [encryption]
      summary: 鍵束を登録する（初期設定）
      description: 既に鍵束があれば置き換えずに 409 を返す。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEncryptionKeyringRequest"
      responses:
        "201":
          description: 登録された鍵束
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncryptionKeyring"
        "403":
          $ref: "#/components/responses/AccountNotAllowed"
        "409":
          description: 既に鍵束が登録されている（`encryption_already_configured`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/encryption/keyring/{kind}:
    parameters:
      - $ref: "#/components/parameters/KeyWrapKind"
    put:
      operationId: replaceEncryptionKeyWrap
      tags: [encryption]
      summary: パスフレーズまたは復旧キーの包みを置き換える
      description: |
        マスター鍵は変えずに、指定した種類の包みだけを置き換える。
        `X-Postall-Key-Proof` にマスター鍵から導いた所持の証明を付ける。
      parameters:
        - $ref: "#/components/parameters/KeyProof"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyWrap"
      responses:
        "200":
          description: 置き換え後の鍵束
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncryptionKeyring"
        "403":
          description: |
            次のいずれか。`code` で区別する。
            - `account_not_allowed`: このアカウントでは利用が許可されていない（許可リストに含まれない）
            - `key_proof_mismatch`: 所持の証明が鍵束と一致しない。鍵束は変更されない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 鍵束が未設定（`encryption_not_configured`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ChannelId:
      name: channelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EmojiId:
      name: emojiId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EmojiShortcode:
      name: shortcode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
    KeyWrapKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [passphrase, recovery]
    KeyProof:
      name: X-Postall-Key-Proof
      in: header
      required: true
      description: マスター鍵から HKDF で導いた所持の証明（32 バイト、base64url）
      schema:
        type: string
  responses:
    Error:
      description: 一貫したエラー形式
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AccountNotAllowed:
      description: このアカウントでは利用が許可されていない（許可リストに含まれない）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: account_not_allowed
            message: このアカウントでは利用が許可されていません
    PostContentRejected:
      description: |
        本文の検証に失敗した。`code` で区別する。
        - `empty_content`: 本文も添付も無い
        - `encryption_required`: 暗号化チャネルへの平文（`ciphertext` が無い、または `body` が空でない）
        - `encryption_not_allowed`: 非暗号化チャネルへの暗号文
        - `encrypted_attachments_unsupported`: 暗号化チャネルへの添付
        - `invalid_ciphertext`: 暗号文の形式が不正、または鍵 ID が鍵束と一致しない
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: encryption_required
            message: 暗号化チャネルには暗号文で投稿してください
    EncryptionNotConfigured:
      description: 鍵束が未設定の状態で、暗号化チャネルへ投稿しようとした
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: encryption_not_configured
            message: 暗号化の鍵が設定されていません
  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, unhealthy]
        database:
          type: string
          enum: [ok, skipped, unreachable]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 機械可読なエラーコード
        message:
          type: string
          description: 人間可読なメッセージ
        details:
          type: object
          additionalProperties: true
    Channel:
      type: object
      required: [id, name, sortKey, encrypted, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        sortKey:
          type: string
        encrypted:
          type: boolean
          description: 暗号化チャネルか。作成時に決まり、以後は変わらない。
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ChannelList:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
    CreateChannelRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        parentId:
          type: string
          format: uuid
          nullable: true
        encrypted:
          type: boolean
          default: false
          description: 暗号化チャネルとして作るか。親の値は引き継がない。
    RenameChannelRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
    MoveChannelRequest:
      type: object
      properties:
        parentId:
          type: string
          format: uuid
          nullable: true
        beforeId:
          type: string
          format: uuid
          nullable: true
          description: このチャネルの直前に挿入する。null なら末尾。
        afterId:
          type: string
          format: uuid
          nullable: true
          description: このチャネルの直後に挿入する。
    Post:
      type: object
      required: [id, channelId, authorId, body, encrypted, createdAt, updatedAt, deleted, replyCount]
      properties:
        id:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        threadRootId:
          type: string
          format: uuid
          nullable: true
        authorId:
          type: string
          format: uuid
        body:
          type: string
          description: 本文。暗号化チャネルのポストでは常に空文字。
        encrypted:
          type: boolean
          description: 暗号化チャネルのポストか。属するチャネルの値と一致する。
        ciphertext:
          type: string
          nullable: true
          description: |
            暗号化チャネルのポストの暗号文（`pe1.<keyId>.<iv>.<ciphertext>`）。
            非暗号化チャネルのポストと、削除済みのポストでは null。
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
          nullable: true
        deleted:
          type: boolean
          description: 論理削除済み。スレッド親のプレースホルダでのみ true になる。
        replyCount:
          type: integer
          minimum: 0
        lastReplyAt:
          type: string
          format: date-time
          nullable: true
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        reactions:
          type: array
          description: 最初に付与された順のリアクション集計。
          items:
            $ref: "#/components/schemas/Reaction"
    PostList:
      type: object
      required: [posts]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        nextBefore:
          type: string
          nullable: true
          description: より古いポストを取得するカーソル。これ以上過去が無ければ null。
    CreatePostRequest:
      type: object
      properties:
        body:
          type: string
          description: 本文。添付が無い場合は空であってはならない。暗号化チャネルでは空にする。
        ciphertext:
          type: string
          description: 暗号化チャネルでだけ指定する暗号文。非暗号化チャネルでは指定してはならない。
        attachmentIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10
    EditPostRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          description: 本文。暗号化チャネルのポストでは空にする。
        ciphertext:
          type: string
          description: 暗号化チャネルのポストでだけ指定する、新しい暗号文。
        attachmentIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10
          description: 指定した場合は添付の集合を置き換える。省略時は既存の添付を維持する。
    Attachment:
      type: object
      required: [id, fileName, contentType, sizeBytes, checksum, createdAt]
      properties:
        id:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
          nullable: true
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        checksum:
          type: string
        createdAt:
          type: string
          format: date-time
    StartUploadRequest:
      type: object
      required: [fileName, contentType, sizeBytes, checksum]
      properties:
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        checksum:
          type: string
          description: SHA-256 の hex
    StartUploadResponse:
      type: object
      required: [id, uploadUrl, headers]
      properties:
        id:
          type: string
          format: uuid
        uploadUrl:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
    DownloadUrlResponse:
      type: object
      required: [url, expiresAt]
      properties:
        url:
          type: string
        expiresAt:
          type: string
          format: date-time
    Emoji:
      type: object
      required: [id, shortcode, imagePath, checksum]
      properties:
        id:
          type: string
          format: uuid
        shortcode:
          type: string
        imagePath:
          type: string
        checksum:
          type: string
    EmojiList:
      type: object
      required: [emojis]
      properties:
        emojis:
          type: array
          items:
            $ref: "#/components/schemas/Emoji"
    CreateEmojiRequest:
      type: object
      required: [shortcode, file]
      properties:
        shortcode:
          type: string
          description: 使える文字は英数字・`_`・`-`。先頭は英数字で、長さは 1〜64。
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
        file:
          type: string
          format: binary
          description: PNG または GIF の画像。512 KiB 以下。
    Reaction:
      type: object
      required: [emoji, count, reactedByMe, reactorIds]
      properties:
        emoji:
          $ref: "#/components/schemas/Emoji"
        count:
          type: integer
          minimum: 1
        reactedByMe:
          type: boolean
        reactorIds:
          type: array
          description: 付与者 ID。reactedByMe が true の場合は現在のユーザーを先頭にする。
          items:
            type: string
            format: uuid
    Thread:
      type: object
      required: [root, replies]
      properties:
        root:
          $ref: "#/components/schemas/Post"
        replies:
          type: array
          items:
            $ref: "#/components/schemas/Post"
    SearchResult:
      type: object
      required: [postId, timelinePostId, channelId, channelName, body, createdAt]
      properties:
        postId:
          type: string
          format: uuid
        timelinePostId:
          type: string
          format: uuid
          description: チャネルタイムラインに表示するルートポスト ID。
        channelId:
          type: string
          format: uuid
        channelName:
          type: string
        threadRootId:
          type: string
          format: uuid
          nullable: true
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    SearchResultPage:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        nextCursor:
          type: string
          nullable: true
    ChangeEvent:
      type: object
      required: [id, eventType, createdAt]
      properties:
        id:
          type: string
          pattern: '^[0-9]+$'
          description: JavaScript で精度を失わない十進文字列の単調増加 ID。
        eventType:
          type: string
          enum:
            - channel.created
            - channel.updated
            - channel.deleted
            - post.created
            - post.updated
            - post.deleted
            - reply.created
            - reply.updated
            - reply.deleted
            - reaction.updated
        channelId:
          type: string
          format: uuid
          nullable: true
        postId:
          type: string
          format: uuid
          nullable: true
        threadRootId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
    ChangeEventPage:
      type: object
      required: [events, nextAfter, hasMore]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/ChangeEvent"
        nextAfter:
          type: string
          pattern: '^[0-9]+$'
        hasMore:
          type: boolean
        resetRequired:
          type: boolean
          description: 指定カーソルが保持期間外で、表示中データの全再取得が必要か。省略時は false
    KeyWrap:
      type: object
      description: |
        マスター鍵を、パスフレーズまたは復旧キーから導いた鍵で AES-GCM により包んだもの。
        バイト列の値はすべて base64url（パディング無し）。サーバーは中身を解かずに保存する。
      required: [kdf, salt, iv, wrapped]
      properties:
        kdf:
          type: string
          enum: [pbkdf2-sha256, hkdf-sha256]
          description: パスフレーズの包みは pbkdf2-sha256、復旧キーの包みは hkdf-sha256
        iterations:
          type: integer
          minimum: 600000
          description: kdf が pbkdf2-sha256 のときの反復回数
        salt:
          type: string
        info:
          type: string
          description: kdf が hkdf-sha256 のときの info
        iv:
          type: string
        wrapped:
          type: string
          description: 包んだマスター鍵（32 バイト）と認証タグ
    EncryptionKeyring:
      type: object
      required: [keyId, passphraseWrap, recoveryWrap, createdAt, updatedAt]
      properties:
        keyId:
          type: string
          format: uuid
          description: マスター鍵の ID。暗号文に埋め込まれる
        passphraseWrap:
          $ref: "#/components/schemas/KeyWrap"
        recoveryWrap:
          $ref: "#/components/schemas/KeyWrap"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateEncryptionKeyringRequest:
      type: object
      required: [keyId, keyProof, passphraseWrap, recoveryWrap]
      properties:
        keyId:
          type: string
          format: uuid
        keyProof:
          type: string
          description: マスター鍵から HKDF で導いた所持の証明（32 バイト、base64url）。サーバーは SHA-256 だけを保存する
        passphraseWrap:
          $ref: "#/components/schemas/KeyWrap"
        recoveryWrap:
          $ref: "#/components/schemas/KeyWrap"
security:
  - bearerAuth: []
