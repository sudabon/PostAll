name: postall

services:
  postgres:
    build:
      context: ./postgres
    image: postall-postgres:16-bigm
    environment:
      POSTGRES_USER: postall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postall}
      POSTGRES_DB: postall
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postall -d postall"]
      interval: 5s
      timeout: 5s
      retries: 12
    expose:
      - "5432"
    networks:
      - app
    restart: unless-stopped

  api:
    build:
      context: ../backend
    image: postall-api:local
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_URL: postgres://postall:${POSTGRES_PASSWORD:-postall}@postgres:5432/postall?sslmode=disable
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      AWS_COGNITO_USER_POOL_ID: ${AWS_COGNITO_USER_POOL_ID:-}
      AWS_COGNITO_CLIENT_ID: ${AWS_COGNITO_CLIENT_ID:-}
      S3_BUCKET: ${S3_BUCKET:-}
      EMOJI_DIR: /app/emoji
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - ../emoji:/app/emoji:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 15s
    networks:
      - app
    restart: unless-stopped

  certs-init:
    image: alpine:3.21
    volumes:
      - certs:/certs
      - ./certs:/seed:ro
    command: >
      sh -c 'if [ ! -f /certs/fullchain.pem ]; then
        cp /seed/fullchain.pem /certs/fullchain.pem;
        cp /seed/privkey.pem /certs/privkey.pem;
      fi'
    networks:
      - app

  nginx:
    build:
      context: ./nginx
    image: postall-nginx:local
    ports:
      - "80:80"
      - "443:443"
    environment:
      POSTALL_DOMAIN: ${POSTALL_DOMAIN:-memo.sudabon.com}
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - certs:/etc/nginx/certs:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      certs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - app
    restart: unless-stopped

  certbot:
    build:
      context: ./certbot
    image: postall-certbot:local
    environment:
      POSTALL_DOMAIN: ${POSTALL_DOMAIN:-memo.sudabon.com}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - certs:/etc/nginx/certs
    networks:
      - app
    restart: unless-stopped
    profiles:
      - tls

volumes:
  postgres_data:
  certs:
  letsencrypt:
  certbot_www:

networks:
  app:
    driver: bridge
