# api/openapi.yaml を single source of truth として Dart の型を生成する（design.md D2）。
#
# 生成対象はモデル（json_serializable）のみ。REST クライアントの生成物は
# `make generate` の中で捨てる。Dart 3.8.1 では retrofit と retrofit_generator に
# 互換な組み合わせが存在しないため、クライアントは生成モデルの上に手書きする
# （lib/api/postall_api.dart と lib/api/http_postall_api.dart）。
swagger_parser:
  schema_path: build/openapi.normalized.json
  output_directory: lib/api/generated
  language: dart
  json_serializer: json_serializable
  root_client: false
  put_clients_in_folder: false
  enums_to_json: true
  unknown_enum_value: true
  squash_clients: true
  prefer_schema_source: true
  name_suffix: ''
