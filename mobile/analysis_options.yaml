include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # api/openapi.yaml から生成する。`make generate` で作り直すため手で直さない。
    - lib/api/generated/**
    - build/**

linter:
  rules:
    # 本文・ラベルは日本語のみで、i18n の枠は本 change では持たない（design.md D26）。
    - prefer_single_quotes
    - require_trailing_commas
